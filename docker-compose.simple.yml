# ActiveGate Compatibility Intelligence - Docker Compose
services:
  neo4j:
    image: neo4j:5.14-community
    container_name: agi-neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data

  cli:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: agi-cli
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - neo4j

volumes:
  neo4j_data:
