<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActiveGate Compatibility Intelligence</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
      }
      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        text-align: center;
        padding: 30px 0;
        border-bottom: 1px solid #333;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 2rem;
        color: #00d4ff;
        margin-bottom: 10px;
      }
      .header p {
        color: #888;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab {
        padding: 12px 24px;
        background: #2a2a4a;
        border: none;
        border-radius: 8px;
        color: #aaa;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.2s;
      }
      .tab.active {
        background: #00d4ff;
        color: #1a1a2e;
      }
      .tab:hover:not(.active) {
        background: #3a3a5a;
      }
      .chat-container {
        background: #2a2a4a;
        border-radius: 12px;
        padding: 20px;
        height: 500px;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .message {
        margin-bottom: 15px;
        padding: 15px;
        border-radius: 10px;
        max-width: 80%;
      }
      .message.user {
        background: #00d4ff;
        color: #1a1a2e;
        margin-left: auto;
      }
      .message.bot {
        background: #3a3a5a;
      }
      .message .version-info {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 5px;
      }
      .input-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .input-container input {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #1a1a2e;
        color: #eee;
        font-size: 1rem;
      }
      .input-container input:focus {
        outline: 2px solid #00d4ff;
      }
      .input-container button {
        padding: 15px 30px;
        background: #00d4ff;
        border: none;
        border-radius: 8px;
        color: #1a1a2e;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      .input-container button:hover {
        background: #00b8e6;
      }
      .input-container button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      .data-container {
        background: #2a2a4a;
        border-radius: 12px;
        padding: 20px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: #3a3a5a;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }
      .stat-card h3 {
        font-size: 2rem;
        color: #00d4ff;
      }
      .stat-card p {
        color: #888;
        margin-top: 5px;
      }
      .data-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .data-item {
        background: #3a3a5a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .status-badge {
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .status-badge.go {
        background: #22c55e;
        color: #fff;
      }
      .status-badge.no-go {
        background: #ef4444;
        color: #fff;
      }
      .status-badge.caution {
        background: #f59e0b;
        color: #fff;
      }
      .ingest-form {
        background: #3a3a5a;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .ingest-form textarea {
        width: 100%;
        height: 150px;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #1a1a2e;
        color: #eee;
        font-size: 1rem;
        margin: 10px 0;
        resize: vertical;
      }
      .ingest-form button {
        padding: 12px 24px;
        background: #00d4ff;
        border: none;
        border-radius: 8px;
        color: #1a1a2e;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Use relative URL to go through Nginx proxy
      const API_URL = '/api';

      function App() {
        const [activeTab, setActiveTab] = useState('ingest');
        const [versions, setVersions] = useState([]);
        const [relationships, setRelationships] = useState([]);

        useEffect(() => {
          fetchData();
        }, []);

        const fetchData = async () => {
          try {
            const vRes = await fetch(`${API_URL}/data/versions`);
            const vData = await vRes.json();
            setVersions(vData.versions || []);

            const rRes = await fetch(`${API_URL}/data/relationships`);
            const rData = await rRes.json();
            setRelationships(rData.relationships || []);
          } catch (e) {
            console.error('Failed to fetch data:', e);
          }
        };

        return (
          <div className="app">
            <div className="header">
              <h1>🔧 ActiveGate Compatibility Intelligence</h1>
              <p>
                Check upgrade compatibility between Dynatrace ActiveGate
                versions
              </p>
            </div>

            <div className="tabs">
              <button
                className={`tab ${activeTab === 'ingest' ? 'active' : ''}`}
                onClick={() => setActiveTab('ingest')}
              >
                📥 Ingest Data
              </button>
              <button
                className={`tab ${activeTab === 'chat' ? 'active' : ''}`}
                onClick={() => setActiveTab('chat')}
              >
                💬 Chat
              </button>
              <button
                className={`tab ${activeTab === 'data' ? 'active' : ''}`}
                onClick={() => setActiveTab('data')}
              >
                📊 Data
              </button>
            </div>

            {activeTab === 'ingest' && <IngestTab onDataChange={fetchData} />}
            {activeTab === 'chat' && <ChatTab />}
            {activeTab === 'data' && (
              <DataTab versions={versions} relationships={relationships} />
            )}
          </div>
        );
      }

      function ChatTab() {
        const [messages, setMessages] = useState([
          {
            text: 'Hello! I can help you check ActiveGate upgrade compatibility. Ask me something like "Can I upgrade from 1.330 to 1.335?"',
            user: false,
          },
        ]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const messagesEndRef = useRef(null);

        const scrollToBottom = () => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        };

        useEffect(scrollToBottom, [messages]);

        const sendMessage = async () => {
          if (!input.trim() || loading) return;

          const userMessage = input.trim();
          setMessages((prev) => [...prev, { text: userMessage, user: true }]);
          setInput('');
          setLoading(true);

          try {
            const response = await fetch(`${API_URL}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: userMessage }),
            });
            const data = await response.json();

            setMessages((prev) => [
              ...prev,
              {
                text: data.response,
                user: false,
                status: data.status,
                versions: data.versions_detected,
              },
            ]);
          } catch (e) {
            setMessages((prev) => [
              ...prev,
              {
                text: 'Sorry, I encountered an error. Make sure the API is running.',
                user: false,
              },
            ]);
          }

          setLoading(false);
        };

        const handleKeyPress = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        };

        return (
          <div className="chat-container">
            <div className="messages">
              {messages.map((msg, i) => (
                <div key={i} className={`message ${msg.user ? 'user' : 'bot'}`}>
                  {msg.text}
                  {msg.versions && (
                    <div className="version-info">
                      Detected: {msg.versions.current} → {msg.versions.target}
                    </div>
                  )}
                </div>
              ))}
              {loading && <div className="loading">Thinking...</div>}
              <div ref={messagesEndRef} />
            </div>
            <div className="input-container">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Ask about upgrade compatibility..."
                disabled={loading}
              />
              <button onClick={sendMessage} disabled={loading || !input.trim()}>
                Send
              </button>
            </div>
          </div>
        );
      }

      function DataTab({ versions, relationships }) {
        return (
          <div className="data-container">
            <div className="stats-grid">
              <div className="stat-card">
                <h3>{versions.length}</h3>
                <p>ActiveGate Versions</p>
              </div>
              <div className="stat-card">
                <h3>{relationships.reduce((sum, r) => sum + r.count, 0)}</h3>
                <p>Total Relationships</p>
              </div>
            </div>

            <button
              onClick={async () => {
                if (
                  !window.confirm(
                    'Clear all Neo4j graph data? This is destructive.',
                  )
                )
                  return;
                try {
                  const res = await fetch(`${API_URL}/admin/clear-graph`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                  });
                  const data = await res.json();
                  alert(data.message || data.error || 'Graph clear completed');
                  fetchData();
                } catch (e) {
                  alert('Failed to clear graph: ' + e.message);
                }
              }}
              style={{
                marginBottom: '20px',
                padding: '12px 20px',
                background: '#ef4444',
                color: '#fff',
                border: 'none',
                borderRadius: '8px',
                cursor: 'pointer',
                fontWeight: 'bold',
              }}
            >
              🧹 Clear Graph Data
            </button>

            <h3 style={{ marginBottom: '15px' }}>ActiveGate Versions</h3>
            <div className="data-list">
              {versions.length === 0 ? (
                <p style={{ color: '#888' }}>
                  No versions found. Ingest some data first.
                </p>
              ) : (
                versions.map((v, i) => (
                  <div key={i} className="data-item">
                    <span>{v}</span>
                  </div>
                ))
              )}
            </div>

            <h3 style={{ marginTop: '30px', marginBottom: '15px' }}>
              Relationship Types
            </h3>
            <div className="data-list">
              {relationships.map((r, i) => (
                <div key={i} className="data-item">
                  <span>{r.type}</span>
                  <span className="status-badge go">{r.count}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function IngestTab({ onDataChange }) {
        const [source, setSource] = useState('releases');
        const [url, setUrl] = useState('');
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);

        const sources = [
          {
            id: 'releases',
            label: 'Releases',
            emoji: '📄',
            description: 'Dynatrace release notes',
          },
          {
            id: 'hub',
            label: 'Hub',
            emoji: '🔌',
            description: 'Extensions & compatibility',
          },
          {
            id: 'eos',
            label: 'EOS',
            emoji: '⏰',
            description: 'End-of-support announcements',
          },
          {
            id: 'url',
            label: 'Custom URL',
            emoji: '🌐',
            description: 'Scrape any URL',
          },
        ];

        const handleIngest = async () => {
          if (!source || loading) return;
          if (source === 'url' && !url.trim()) return;

          setLoading(true);
          try {
            const payload = { source };
            if (source === 'url') {
              payload.url = url;
            }

            const response = await fetch(`${API_URL}/ingest`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await response.json();
            setResult(data);
            onDataChange();
          } catch (e) {
            setResult({ error: String(e) });
          }
          setLoading(false);
        };

        return (
          <div className="data-container">
            <h3 style={{ marginBottom: '20px' }}>📥 Data Sources</h3>

            <div
              style={{
                display: 'grid',
                gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                gap: '12px',
                marginBottom: '20px',
              }}
            >
              {sources.map((s) => (
                <button
                  key={s.id}
                  onClick={() => {
                    setSource(s.id);
                    setResult(null);
                  }}
                  disabled={loading}
                  style={{
                    padding: '15px 10px',
                    background: source === s.id ? '#00d4ff' : '#3a3a5a',
                    border: source === s.id ? '2px solid #00d4ff' : 'none',
                    borderRadius: '8px',
                    color: source === s.id ? '#1a1a2e' : '#eee',
                    cursor: loading ? 'not-allowed' : 'pointer',
                    textAlign: 'center',
                    fontSize: '0.95rem',
                    fontWeight: source === s.id ? 'bold' : 'normal',
                    transition: 'all 0.2s',
                    opacity: loading ? 0.5 : 1,
                  }}
                >
                  <div>{s.emoji}</div>
                  <div style={{ fontSize: '0.85rem', marginTop: '5px' }}>
                    {s.label}
                  </div>
                  <div
                    style={{
                      fontSize: '0.7rem',
                      opacity: 0.7,
                      marginTop: '3px',
                    }}
                  >
                    {s.description}
                  </div>
                </button>
              ))}
            </div>

            {source === 'url' && (
              <div style={{ marginBottom: '15px' }}>
                <input
                  type="url"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://example.com..."
                  disabled={loading}
                  style={{
                    width: '100%',
                    padding: '12px',
                    background: '#1a1a2e',
                    border: '1px solid #3a3a5a',
                    borderRadius: '8px',
                    color: '#eee',
                    fontSize: '0.95rem',
                  }}
                />
              </div>
            )}

            {source && (
              <button
                onClick={handleIngest}
                disabled={loading || (source === 'url' && !url.trim())}
                style={{
                  padding: '12px 30px',
                  background: '#00d4ff',
                  border: 'none',
                  borderRadius: '8px',
                  color: '#1a1a2e',
                  fontSize: '1rem',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  fontWeight: 'bold',
                  opacity:
                    loading || (source === 'url' && !url.trim()) ? 0.5 : 1,
                  transition: 'all 0.2s',
                }}
              >
                {loading ? '⏳ Ingesting...' : '✓ Start Ingestion'}
              </button>
            )}

            {result && (
              <div style={{ marginTop: '20px' }}>
                {result.error ? (
                  <div
                    style={{
                      background: '#3a3a5a',
                      border: '1px solid #ef4444',
                      color: '#ef4444',
                      padding: '15px',
                      borderRadius: '8px',
                    }}
                  >
                    ❌ Error: {result.error}
                  </div>
                ) : (
                  <div
                    style={{
                      background: '#3a3a5a',
                      border: '1px solid #22c55e',
                      color: '#22c55e',
                      padding: '15px',
                      borderRadius: '8px',
                    }}
                  >
                    <div>✓ Ingestion successful!</div>
                    <div
                      style={{
                        fontSize: '0.9rem',
                        marginTop: '8px',
                        color: '#eee',
                      }}
                    >
                      <div>
                        Source: <strong>{result.source}</strong>
                      </div>
                      <div>
                        Items scraped: <strong>{result.items_scraped}</strong>
                      </div>
                      <div>
                        Facts extracted:{' '}
                        <strong>{result.facts_extracted}</strong>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
