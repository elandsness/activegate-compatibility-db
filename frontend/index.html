<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActiveGate Compatibility Intelligence</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/vis-network/styles/vis-network.min.css"
    />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
      }
      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        text-align: center;
        padding: 30px 0;
        border-bottom: 1px solid #333;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 2rem;
        color: #00d4ff;
        margin-bottom: 10px;
      }
      .header p {
        color: #888;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab {
        padding: 12px 24px;
        background: #2a2a4a;
        border: none;
        border-radius: 8px;
        color: #aaa;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.2s;
      }
      .tab.active {
        background: #00d4ff;
        color: #1a1a2e;
      }
      .tab:hover:not(.active) {
        background: #3a3a5a;
      }
      .chat-container {
        background: #2a2a4a;
        border-radius: 12px;
        padding: 20px;
        height: 500px;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .message {
        margin-bottom: 15px;
        padding: 15px;
        border-radius: 10px;
        max-width: 80%;
      }
      .message.user {
        background: #00d4ff;
        color: #1a1a2e;
        margin-left: auto;
      }
      .message.bot {
        background: #3a3a5a;
      }
      .message .version-info {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 5px;
      }
      .input-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .input-container input {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #1a1a2e;
        color: #eee;
        font-size: 1rem;
      }
      .input-container input:focus {
        outline: 2px solid #00d4ff;
      }
      .input-container button {
        padding: 15px 30px;
        background: #00d4ff;
        border: none;
        border-radius: 8px;
        color: #1a1a2e;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      .input-container button:hover {
        background: #00b8e6;
      }
      .input-container button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      .data-container {
        background: #2a2a4a;
        border-radius: 12px;
        padding: 20px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: #3a3a5a;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }
      .stat-card h3 {
        font-size: 2rem;
        color: #00d4ff;
      }
      .stat-card p {
        color: #888;
        margin-top: 5px;
      }
      .data-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .data-item {
        background: #3a3a5a;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .status-badge {
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .status-badge.go {
        background: #22c55e;
        color: #fff;
      }
      .status-badge.no-go {
        background: #ef4444;
        color: #fff;
      }
      .status-badge.caution {
        background: #f59e0b;
        color: #fff;
      }
      .ingest-form {
        background: #3a3a5a;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .ingest-form textarea {
        width: 100%;
        height: 150px;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #1a1a2e;
        color: #eee;
        font-size: 1rem;
        margin: 10px 0;
        resize: vertical;
      }
      .ingest-form button {
        padding: 12px 24px;
        background: #00d4ff;
        border: none;
        border-radius: 8px;
        color: #1a1a2e;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #888;
      }
      .progress-track {
        margin-top: 14px;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #24243d;
        overflow: hidden;
        border: 1px solid #3f3f60;
      }
      .progress-bar {
        width: 35%;
        height: 100%;
        background: linear-gradient(90deg, #00d4ff, #59e0ff);
        border-radius: 999px;
        animation: ingest-progress 1.2s ease-in-out infinite;
      }
      .graph-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        align-items: center;
      }
      .graph-toolbar input,
      .graph-toolbar select {
        background: #1a1a2e;
        border: 1px solid #4a4a6f;
        border-radius: 6px;
        color: #eee;
        padding: 9px 10px;
      }
      .graph-toolbar button {
        background: #2d9bb8;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px 12px;
        cursor: pointer;
        font-weight: bold;
      }
      .graph-toolbar button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .graph-canvas {
        width: 100%;
        height: 620px;
        border: 1px solid #4a4a6f;
        border-radius: 10px;
        background:
          radial-gradient(circle at 20% 20%, #232348 0%, #171730 55%, #111123 100%);
      }
      .graph-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
        align-items: start;
      }
      .graph-sidepanel {
        background: #313154;
        border: 1px solid #4a4a6f;
        border-radius: 10px;
        min-height: 620px;
        padding: 12px;
      }
      .graph-sidepanel h4 {
        color: #9ddfff;
        margin-bottom: 8px;
      }
      .graph-sidepanel p {
        color: #d1d5db;
        font-size: 0.9rem;
        line-height: 1.45;
      }
      .panel-section {
        margin-top: 12px;
        border-top: 1px solid #4a4a6f;
        padding-top: 10px;
      }
      .panel-kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.88rem;
        padding: 4px 0;
      }
      .panel-kv span:first-child {
        color: #a1a1aa;
      }
      .panel-kv span:last-child {
        color: #f1f5f9;
        text-align: right;
        word-break: break-word;
      }
      .panel-list {
        max-height: 250px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .panel-item {
        background: #262645;
        border: 1px solid #3f3f60;
        border-radius: 8px;
        padding: 8px;
        font-size: 0.84rem;
        color: #dbe4ef;
      }
      .panel-badge {
        display: inline-block;
        margin-top: 6px;
        font-size: 0.76rem;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .panel-badge.compatible {
        color: #86efac;
        border-color: #22c55e;
      }
      .panel-badge.questionable {
        color: #fcd34d;
        border-color: #f59e0b;
      }
      .panel-badge.incompatible {
        color: #fda4af;
        border-color: #ef4444;
      }
      .panel-badge.unknown {
        color: #cbd5e1;
        border-color: #94a3b8;
      }
      .graph-legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        color: #ddd;
        font-size: 0.9rem;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-swatch {
        width: 18px;
        height: 4px;
        border-radius: 999px;
      }
      @media (max-width: 900px) {
        .graph-layout {
          grid-template-columns: 1fr;
        }
        .graph-sidepanel {
          min-height: 220px;
        }
        .graph-canvas {
          height: 520px;
        }
      }
      @keyframes ingest-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(290%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Use relative URL to go through Nginx proxy
      const API_URL = '/api';

      async function parseApiResponse(response) {
        const contentType = response.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
          return await response.json();
        }

        const text = await response.text();
        return {
          error: `Unexpected ${response.status} response: ${text.slice(0, 200)}`,
        };
      }

      function App() {
        const [activeTab, setActiveTab] = useState('ingest');
        const [versions, setVersions] = useState([]);
        const [managedVersions, setManagedVersions] = useState([]);
        const [relationships, setRelationships] = useState([]);
        const [hubSummary, setHubSummary] = useState({});

        useEffect(() => {
          fetchData();
        }, []);

        const fetchData = async () => {
          try {
            const vRes = await fetch(`${API_URL}/data/versions`);
            const vData = await parseApiResponse(vRes);
            setVersions(vData.versions || []);

            const mvRes = await fetch(`${API_URL}/data/managed-versions`);
            const mvData = await parseApiResponse(mvRes);
            setManagedVersions(mvData.versions || []);

            const rRes = await fetch(`${API_URL}/data/relationships`);
            const rData = await parseApiResponse(rRes);
            setRelationships(rData.relationships || []);

            const hRes = await fetch(`${API_URL}/data/hub-summary`);
            const hData = await parseApiResponse(hRes);
            setHubSummary(hData || {});
          } catch (e) {
            console.error('Failed to fetch data:', e);
          }
        };

        return (
          <div className="app">
            <div className="header">
              <h1>🔧 ActiveGate Compatibility Intelligence</h1>
              <p>
                Check upgrade compatibility between Dynatrace ActiveGate
                versions
              </p>
            </div>

            <div className="tabs">
              <button
                className={`tab ${activeTab === 'ingest' ? 'active' : ''}`}
                onClick={() => setActiveTab('ingest')}
              >
                📥 Ingest Data
              </button>
              <button
                className={`tab ${activeTab === 'chat' ? 'active' : ''}`}
                onClick={() => setActiveTab('chat')}
              >
                💬 Chat
              </button>
              <button
                className={`tab ${activeTab === 'batch' ? 'active' : ''}`}
                onClick={() => setActiveTab('batch')}
              >
                📄 Batch CSV Check
              </button>
              <button
                className={`tab ${activeTab === 'data' ? 'active' : ''}`}
                onClick={() => setActiveTab('data')}
              >
                📊 Data
              </button>
              <button
                className={`tab ${activeTab === 'graph' ? 'active' : ''}`}
                onClick={() => setActiveTab('graph')}
              >
                🕸️ Graph
              </button>
            </div>

            {activeTab === 'ingest' && <IngestTab onDataChange={fetchData} />}
            {activeTab === 'chat' && <ChatTab />}
            {activeTab === 'batch' && <BatchCheckTab />}
            {activeTab === 'data' && (
              <DataTab
                versions={versions}
                managedVersions={managedVersions}
                relationships={relationships}
                hubSummary={hubSummary}
                onDataChange={fetchData}
              />
            )}
            {activeTab === 'graph' && <GraphTab versions={versions} />}
          </div>
        );
      }

      function ChatTab() {
        const [messages, setMessages] = useState([
          {
            text: 'Hello! I can help with ActiveGate upgrade decisions. I will first collect all required details (current ActiveGate, desired ActiveGate, Managed Cluster version, OS family/version, and installed extensions with versions) before returning GO/NO-GO.',
            user: false,
          },
        ]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const [conversationContext, setConversationContext] = useState({});
        const messagesEndRef = useRef(null);

        const scrollToBottom = () => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        };

        useEffect(scrollToBottom, [messages]);

        const sendMessage = async () => {
          if (!input.trim() || loading) return;

          const userMessage = input.trim();
          setMessages((prev) => [...prev, { text: userMessage, user: true }]);
          setInput('');
          setLoading(true);

          try {
            const response = await fetch(`${API_URL}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: userMessage, context: conversationContext }),
            });
            const data = await parseApiResponse(response);

            if (!response.ok || data.error) {
              throw new Error(data.error || `Request failed with ${response.status}`);
            }

            if (data.collected_context) {
              setConversationContext(data.collected_context);
            }

            setMessages((prev) => [
              ...prev,
              {
                text: data.response,
                user: false,
                status: data.status,
                versions: data.versions_detected,
              },
            ]);
          } catch (e) {
            setMessages((prev) => [
              ...prev,
              {
                text: `Sorry, I encountered an error: ${e.message}`,
                user: false,
              },
            ]);
          }

          setLoading(false);
        };

        const handleKeyPress = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        };

        return (
          <div className="chat-container">
            <div className="messages">
              {messages.map((msg, i) => (
                <div key={i} className={`message ${msg.user ? 'user' : 'bot'}`}>
                  {msg.text}
                  {msg.versions && (
                    <div className="version-info">
                      Detected: {msg.versions.current} → {msg.versions.target}
                    </div>
                  )}
                </div>
              ))}
              {loading && <div className="loading">Thinking...</div>}
              <div ref={messagesEndRef} />
            </div>
            <div className="input-container">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyPress={handleKeyPress}
                placeholder="Ask about upgrade compatibility..."
                disabled={loading}
              />
              <button onClick={sendMessage} disabled={loading || !input.trim()}>
                Send
              </button>
            </div>
          </div>
        );
      }

      function DataTab({ versions, managedVersions, relationships, hubSummary, onDataChange }) {
        const coverageStatus = hubSummary.status || 'NO_DATA';

        return (
          <div className="data-container">
            <div className="stats-grid">
              <div className="stat-card">
                <h3>{versions.length}</h3>
                <p>ActiveGate Versions</p>
              </div>
              <div className="stat-card">
                <h3>{managedVersions.length}</h3>
                <p>Managed Versions</p>
              </div>
              <div className="stat-card">
                <h3>{relationships.reduce((sum, r) => sum + r.count, 0)}</h3>
                <p>Total Relationships</p>
              </div>
              <div className="stat-card">
                <h3>{hubSummary.active_items || 0}</h3>
                <p>Managed Hub Items</p>
              </div>
              <div className="stat-card">
                <h3>{hubSummary.extension2_items || 0}</h3>
                <p>Extension-2 Items</p>
              </div>
            </div>

            <div
              style={{
                marginBottom: '20px',
                padding: '14px 16px',
                borderRadius: '8px',
                background: '#3a3a5a',
                border:
                  coverageStatus === 'HEALTHY'
                    ? '1px solid #22c55e'
                    : coverageStatus === 'DEGRADED'
                      ? '1px solid #f59e0b'
                      : '1px solid #555',
              }}
            >
              <div style={{ fontWeight: 'bold' }}>
                Hub Coverage: {coverageStatus}
              </div>
              <div style={{ marginTop: '6px', color: '#ddd', fontSize: '0.92rem' }}>
                Active: {hubSummary.active_items || 0} / Expected:{' '}
                {hubSummary.expected_count || 0} | Mismatch:{' '}
                {hubSummary.count_mismatch || 0}
              </div>
            </div>

            <button
              onClick={async () => {
                if (
                  !window.confirm(
                    'Clear all Neo4j graph data? This is destructive.',
                  )
                )
                  return;
                try {
                  const res = await fetch(`${API_URL}/admin/clear-graph`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                  });
                  const data = await res.json();
                  alert(data.message || data.error || 'Graph clear completed');
                  onDataChange();
                } catch (e) {
                  alert('Failed to clear graph: ' + e.message);
                }
              }}
              style={{
                marginBottom: '20px',
                padding: '12px 20px',
                background: '#ef4444',
                color: '#fff',
                border: 'none',
                borderRadius: '8px',
                cursor: 'pointer',
                fontWeight: 'bold',
              }}
            >
              🧹 Clear Graph Data
            </button>

            <h3 style={{ marginBottom: '15px' }}>ActiveGate Versions</h3>
            <div className="data-list">
              {versions.length === 0 ? (
                <p style={{ color: '#888' }}>
                  No versions found. Ingest some data first.
                </p>
              ) : (
                versions.map((v, i) => (
                  <div key={i} className="data-item">
                    <span>{v}</span>
                  </div>
                ))
              )}
            </div>

            <h3 style={{ marginTop: '30px', marginBottom: '15px' }}>
              Managed Versions
            </h3>
            <div className="data-list">
              {managedVersions.length === 0 ? (
                <p style={{ color: '#888' }}>
                  No managed versions found. Run Managed or All ingestion.
                </p>
              ) : (
                managedVersions.map((v, i) => (
                  <div key={i} className="data-item">
                    <span>{v}</span>
                  </div>
                ))
              )}
            </div>

            <h3 style={{ marginTop: '30px', marginBottom: '15px' }}>
              Relationship Types
            </h3>
            <div className="data-list">
              {relationships.map((r, i) => (
                <div key={i} className="data-item">
                  <span>{r.type}</span>
                  <span className="status-badge go">{r.count}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function GraphTab({ versions }) {
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [graphData, setGraphData] = useState({ nodes: [], edges: [], status_counts: {} });
        const [activeGateFilter, setActiveGateFilter] = useState('');
        const [statusFilter, setStatusFilter] = useState('all');
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedNodeId, setSelectedNodeId] = useState('');
        const [selectedNodeData, setSelectedNodeData] = useState(null);
        const [selectedConnections, setSelectedConnections] = useState([]);

        const graphContainerRef = useRef(null);
        const networkRef = useRef(null);
        const visibleNodesRef = useRef([]);

        const loadGraph = async () => {
          setLoading(true);
          setError('');
          try {
            const params = new URLSearchParams();
            params.set('limit', '700');
            if (activeGateFilter) {
              params.set('activegate_version', activeGateFilter);
            }

            const res = await fetch(`${API_URL}/data/graph?${params.toString()}`);
            const data = await parseApiResponse(res);
            if (!res.ok || data.error) {
              throw new Error(data.error || `Graph fetch failed with ${res.status}`);
            }
            setGraphData({
              nodes: data.nodes || [],
              edges: data.edges || [],
              status_counts: data.status_counts || {},
            });
            setSelectedNodeId('');
            setSelectedNodeData(null);
            setSelectedConnections([]);
          } catch (e) {
            setError(e.message || String(e));
          }
          setLoading(false);
        };

        useEffect(() => {
          loadGraph();
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        useEffect(() => {
          if (!graphContainerRef.current) return;

          if (networkRef.current) {
            networkRef.current.destroy();
            networkRef.current = null;
          }

          const edges =
            statusFilter === 'all'
              ? graphData.edges
              : graphData.edges.filter((e) => e.status === statusFilter);

          const connectedIds = new Set();
          edges.forEach((e) => {
            connectedIds.add(e.source);
            connectedIds.add(e.target);
          });

          // Keep release nodes visible even if a filter produces sparse edges.
          const nodes = graphData.nodes.filter(
            (n) => connectedIds.has(n.id) || n.type === 'ActiveGateVersion',
          );
          visibleNodesRef.current = nodes;

          const visNodes = new vis.DataSet(
            nodes.map((n) => {
              const isActiveGate = n.type === 'ActiveGateVersion';
              const group = n.type || 'Node';
              return {
                id: n.id,
                label: n.label,
                title: `${n.type}: ${n.label}`,
                group,
                shape: isActiveGate ? 'dot' : 'ellipse',
                size: isActiveGate ? 20 : 14,
              };
            }),
          );

          const visEdges = new vis.DataSet(
            edges.map((e) => ({
              id: e.id,
              from: e.source,
              to: e.target,
              label: edges.length <= 130 ? e.relationship : '',
              title: `${e.relationship} (${e.status})`,
              arrows: 'to',
              color: { color: e.color },
              width: 2.2,
              smooth: { type: 'dynamic' },
            })),
          );

          const options = {
            autoResize: true,
            manipulation: {
              enabled: false,
            },
            interaction: {
              hover: true,
              navigationButtons: true,
              keyboard: true,
              tooltipDelay: 80,
              multiselect: false,
              zoomView: true,
              dragView: true,
              dragNodes: true,
            },
            layout: {
              improvedLayout: true,
              randomSeed: 17,
            },
            configure: {
              enabled: false,
            },
            physics: {
              barnesHut: {
                gravitationalConstant: -3800,
                springLength: 145,
                springConstant: 0.02,
                damping: 0.45,
                avoidOverlap: 0.35,
              },
              stabilization: {
                enabled: true,
                iterations: 280,
                updateInterval: 40,
              },
              minVelocity: 0.75,
              timestep: 0.5,
              adaptiveTimestep: true,
              solver: 'barnesHut',
            },
            nodes: {
              font: {
                color: '#f1f5f9',
                strokeWidth: 0,
              },
              borderWidth: 1,
              scaling: {
                min: 12,
                max: 25,
              },
            },
            edges: {
              font: {
                color: '#d1d5db',
                size: 9,
                align: 'middle',
                background: '#1a1a2e',
                strokeWidth: 0,
              },
              selectionWidth: 1.6,
              hoverWidth: 1.2,
            },
            groups: {
              ActiveGateVersion: { color: { background: '#0ea5e9', border: '#38bdf8' } },
              ManagedClusterVersion: { color: { background: '#64748b', border: '#94a3b8' } },
              OSVersion: { color: { background: '#334155', border: '#64748b' } },
              Extension: { color: { background: '#14532d', border: '#22c55e' } },
              HubItem: { color: { background: '#3f3f46', border: '#71717a' } },
              HubItemRelease: { color: { background: '#3f3f46', border: '#71717a' } },
              Module: { color: { background: '#4c1d95', border: '#8b5cf6' } },
              Setting: { color: { background: '#3f6212', border: '#84cc16' } },
              Node: { color: { background: '#475569', border: '#94a3b8' } },
            },
          };

          networkRef.current = new vis.Network(
            graphContainerRef.current,
            { nodes: visNodes, edges: visEdges },
            options,
          );

          networkRef.current.on('selectNode', (params) => {
            const nodeId = params.nodes?.[0];
            setSelectedNodeId(nodeId || '');
          });

          networkRef.current.on('deselectNode', () => {
            setSelectedNodeId('');
          });

          networkRef.current.once('stabilizationIterationsDone', () => {
            if (networkRef.current) {
              networkRef.current.setOptions({ physics: { enabled: false } });
            }
          });

          if (nodes.length > 0) {
            networkRef.current.fit({ animation: true });
          }
        }, [graphData, statusFilter]);

        useEffect(() => {
          if (!selectedNodeId) {
            setSelectedNodeData(null);
            setSelectedConnections([]);
            return;
          }

          const node = graphData.nodes.find((n) => n.id === selectedNodeId) || null;
          setSelectedNodeData(node);

          if (!node) {
            setSelectedConnections([]);
            return;
          }

          const connections = graphData.edges
            .filter((e) => e.source === selectedNodeId || e.target === selectedNodeId)
            .map((e) => {
              const peerId = e.source === selectedNodeId ? e.target : e.source;
              const peer = graphData.nodes.find((n) => n.id === peerId);
              return {
                id: e.id,
                relationship: e.relationship,
                status: e.status,
                confidence: e.confidence,
                peerLabel: peer?.label || peerId,
                peerType: peer?.type || 'Node',
                direction: e.source === selectedNodeId ? 'outgoing' : 'incoming',
              };
            });

          connections.sort((a, b) => a.peerLabel.localeCompare(b.peerLabel));
          setSelectedConnections(connections);
        }, [selectedNodeId, graphData]);

        const focusSearch = () => {
          const q = searchTerm.trim().toLowerCase();
          if (!q || !networkRef.current) return;

          const match = visibleNodesRef.current.find((n) =>
            (n.label || '').toLowerCase().includes(q),
          );
          if (!match) {
            setError(`No visible node found for search: ${searchTerm}`);
            return;
          }

          setError('');
          setSelectedNodeId(match.id);
          networkRef.current.selectNodes([match.id]);
          networkRef.current.focus(match.id, {
            scale: 1.25,
            animation: { duration: 450, easingFunction: 'easeInOutQuad' },
          });
        };

        const compatibleCount = graphData.status_counts?.compatible || 0;
        const questionableCount = graphData.status_counts?.questionable || 0;
        const incompatibleCount = graphData.status_counts?.incompatible || 0;
        const unknownCount = graphData.status_counts?.unknown || 0;

        return (
          <div className="data-container">
            <div className="stats-grid" style={{ marginBottom: '12px' }}>
              <div className="stat-card">
                <h3>{graphData.nodes.length}</h3>
                <p>Nodes</p>
              </div>
              <div className="stat-card">
                <h3>{graphData.edges.length}</h3>
                <p>Edges</p>
              </div>
              <div className="stat-card">
                <h3>{compatibleCount}</h3>
                <p>Compatible (Green)</p>
              </div>
              <div className="stat-card">
                <h3>{questionableCount + incompatibleCount}</h3>
                <p>Risk (Yellow + Red)</p>
              </div>
            </div>

            <div className="graph-toolbar">
              <select
                value={activeGateFilter}
                onChange={(e) => setActiveGateFilter(e.target.value)}
                disabled={loading}
              >
                <option value="">All ActiveGate Versions</option>
                {versions.map((version) => (
                  <option key={version} value={version}>
                    {version}
                  </option>
                ))}
              </select>

              <select
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
              >
                <option value="all">All Line Types</option>
                <option value="compatible">Green only</option>
                <option value="questionable">Yellow only</option>
                <option value="incompatible">Red only</option>
                <option value="unknown">Unknown only</option>
              </select>

              <button onClick={loadGraph} disabled={loading}>
                {loading ? 'Loading...' : 'Reload Graph'}
              </button>

              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') focusSearch();
                }}
                placeholder="Search node label..."
              />

              <button onClick={focusSearch} disabled={!searchTerm.trim()}>
                Find Node
              </button>

              <button
                onClick={() => {
                  if (networkRef.current) {
                    networkRef.current.setOptions({ physics: { enabled: true } });
                    networkRef.current.fit({ animation: true });
                  }
                }}
              >
                Fit View
              </button>

              <button
                onClick={() => {
                  if (networkRef.current) {
                    networkRef.current.setOptions({ physics: { enabled: true } });
                    networkRef.current.stabilize(140);
                  }
                }}
              >
                Re-balance
              </button>
            </div>

            <div className="graph-legend">
              <div className="legend-item">
                <span className="legend-swatch" style={{ background: '#22c55e' }} />
                <span>Compatible ({compatibleCount})</span>
              </div>
              <div className="legend-item">
                <span className="legend-swatch" style={{ background: '#f59e0b' }} />
                <span>Questionable ({questionableCount})</span>
              </div>
              <div className="legend-item">
                <span className="legend-swatch" style={{ background: '#ef4444' }} />
                <span>Incompatible ({incompatibleCount})</span>
              </div>
              <div className="legend-item">
                <span className="legend-swatch" style={{ background: '#94a3b8' }} />
                <span>Unknown ({unknownCount})</span>
              </div>
            </div>

            {error && (
              <div
                style={{
                  marginBottom: '12px',
                  background: '#3a3a5a',
                  border: '1px solid #ef4444',
                  borderRadius: '8px',
                  color: '#fda4af',
                  padding: '10px 12px',
                }}
              >
                {error}
              </div>
            )}

            <div className="graph-layout">
              <div className="graph-canvas" ref={graphContainerRef} />
              <div className="graph-sidepanel">
                <h4>Node Details</h4>
                {!selectedNodeData ? (
                  <p>
                    Click any node to inspect its properties and relationships.
                  </p>
                ) : (
                  <>
                    <div className="panel-kv">
                      <span>Label</span>
                      <span>{selectedNodeData.label}</span>
                    </div>
                    <div className="panel-kv">
                      <span>Type</span>
                      <span>{selectedNodeData.type}</span>
                    </div>
                    <div className="panel-kv">
                      <span>Connections</span>
                      <span>{selectedConnections.length}</span>
                    </div>

                    <div className="panel-section">
                      <h4>Properties</h4>
                      {Object.keys(selectedNodeData.properties || {}).length === 0 ? (
                        <p>No node properties available.</p>
                      ) : (
                        Object.entries(selectedNodeData.properties || {}).map(
                          ([key, value]) => (
                            <div key={key} className="panel-kv">
                              <span>{key}</span>
                              <span>{String(value)}</span>
                            </div>
                          ),
                        )
                      )}
                    </div>

                    <div className="panel-section">
                      <h4>Connected Links</h4>
                      {selectedConnections.length === 0 ? (
                        <p>No visible links for this node in current filters.</p>
                      ) : (
                        <div className="panel-list">
                          {selectedConnections.slice(0, 80).map((conn) => (
                            <div key={conn.id} className="panel-item">
                              <div>
                                {conn.direction === 'outgoing' ? '→' : '←'} {conn.relationship}
                              </div>
                              <div>
                                {conn.peerType}: {conn.peerLabel}
                              </div>
                              {conn.confidence !== null && conn.confidence !== undefined && (
                                <div>Confidence: {String(conn.confidence)}</div>
                              )}
                              <span className={`panel-badge ${conn.status}`}>
                                {conn.status}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function BatchCheckTab() {
        const [file, setFile] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [successMessage, setSuccessMessage] = useState('');

        const downloadBlob = (blob, filename) => {
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = filename;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);
        };

        const handleDownloadTemplate = async () => {
          setError('');
          setSuccessMessage('');
          try {
            const response = await fetch(`${API_URL}/check/template`);
            if (!response.ok) {
              const data = await parseApiResponse(response);
              throw new Error(data.error || `Template download failed with ${response.status}`);
            }

            const blob = await response.blob();
            downloadBlob(blob, 'activegate-compatibility-template.csv');
            setSuccessMessage('Template downloaded successfully.');
          } catch (e) {
            setError(e.message || String(e));
          }
        };

        const handleBatchUpload = async () => {
          if (!file || loading) return;

          setLoading(true);
          setError('');
          setSuccessMessage('');

          try {
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch(`${API_URL}/check/batch-csv`, {
              method: 'POST',
              body: formData,
            });

            if (!response.ok) {
              const data = await parseApiResponse(response);
              throw new Error(data.error || `Batch processing failed with ${response.status}`);
            }

            const blob = await response.blob();
            const sourceName = file.name.replace(/\.csv$/i, '');
            const outputName = `${sourceName || 'activegate-batch'}-with-findings.csv`;
            downloadBlob(blob, outputName);
            setSuccessMessage('Batch processing complete. Download started.');
          } catch (e) {
            setError(e.message || String(e));
          }

          setLoading(false);
        };

        return (
          <div className="data-container">
            <h3 style={{ marginBottom: '10px' }}>📄 Batch Compatibility Check</h3>
            <p style={{ marginBottom: '16px', color: '#bbb', fontSize: '0.92rem' }}>
              Upload a UTF-8 comma-separated CSV with one ActiveGate environment per row.
              You will receive a processed CSV with compatibility findings columns appended.
            </p>

            <div
              style={{
                background: '#313154',
                border: '1px solid #4a4a6f',
                borderRadius: '8px',
                padding: '14px',
                marginBottom: '14px',
              }}
            >
              <div style={{ marginBottom: '8px', fontWeight: 'bold' }}>Input contract</div>
              <div style={{ color: '#ddd', fontSize: '0.9rem', lineHeight: 1.5 }}>
                Required headers:
                {' current_activegate_version,target_activegate_version,managed_cluster_version,os_family,os_version,extensions'}
              </div>
              <div style={{ color: '#ddd', fontSize: '0.9rem', lineHeight: 1.5 }}>
                Extensions cell format:
                {' {"ext-id":"1.2.3","another-ext":"4.5.6"}'}
              </div>
            </div>

            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '16px' }}>
              <button
                onClick={handleDownloadTemplate}
                disabled={loading}
                style={{
                  padding: '10px 16px',
                  background: '#2d9bb8',
                  border: 'none',
                  borderRadius: '6px',
                  color: '#fff',
                  cursor: loading ? 'not-allowed' : 'pointer',
                  opacity: loading ? 0.7 : 1,
                }}
              >
                Download Template
              </button>

              <input
                type="file"
                accept=".csv,text/csv"
                disabled={loading}
                onChange={(e) => {
                  setFile(e.target.files?.[0] || null);
                  setError('');
                  setSuccessMessage('');
                }}
                style={{
                  background: '#1a1a2e',
                  border: '1px solid #4a4a6f',
                  borderRadius: '6px',
                  padding: '8px',
                  color: '#eee',
                }}
              />

              <button
                onClick={handleBatchUpload}
                disabled={loading || !file}
                style={{
                  padding: '10px 16px',
                  background: '#00d4ff',
                  border: 'none',
                  borderRadius: '6px',
                  color: '#1a1a2e',
                  cursor: loading || !file ? 'not-allowed' : 'pointer',
                  opacity: loading || !file ? 0.6 : 1,
                  fontWeight: 'bold',
                }}
              >
                {loading ? 'Processing...' : 'Upload and Process CSV'}
              </button>
            </div>

            {file && (
              <div style={{ color: '#bbb', fontSize: '0.9rem', marginBottom: '10px' }}>
                Selected file: {file.name}
              </div>
            )}

            {error && (
              <div
                style={{
                  background: '#3a3a5a',
                  border: '1px solid #ef4444',
                  color: '#ef4444',
                  padding: '12px',
                  borderRadius: '8px',
                }}
              >
                Error: {error}
              </div>
            )}

            {successMessage && (
              <div
                style={{
                  background: '#2c3f32',
                  border: '1px solid #22c55e',
                  color: '#9ef5bc',
                  padding: '12px',
                  borderRadius: '8px',
                }}
              >
                {successMessage}
              </div>
            )}
          </div>
        );
      }

      function IngestTab({ onDataChange }) {
        const [advancedOpen, setAdvancedOpen] = useState(false);
        const [source, setSource] = useState('url');
        const [url, setUrl] = useState('');
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);

        const handleIngest = async (ingestSource) => {
          if (!ingestSource || loading) return;
          if (ingestSource === 'url' && !url.trim()) return;

          setLoading(true);
          try {
            const payload = { source: ingestSource };
            if (ingestSource === 'url') {
              payload.url = url;
            }

            const response = await fetch(`${API_URL}/ingest`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            const data = await parseApiResponse(response);

            if (!response.ok || data.error) {
              setResult({
                error:
                  data.error || `Ingestion failed with HTTP ${response.status}`,
              });
            } else {
              setResult(data);
              onDataChange();
            }
          } catch (e) {
            setResult({ error: String(e) });
          }
          setLoading(false);
        };

        return (
          <div className="data-container">
            <h3 style={{ marginBottom: '8px' }}>📥 Import Dataset</h3>
            <p style={{ marginBottom: '18px', color: '#bbb', fontSize: '0.92rem' }}>
              Runs ActiveGate Releases + Managed Releases + Hub + End-of-Support ingestion in one pass.
            </p>

            <button
              onClick={() => handleIngest('all')}
              disabled={loading}
              style={{
                padding: '12px 30px',
                background: '#00d4ff',
                border: 'none',
                borderRadius: '8px',
                color: '#1a1a2e',
                fontSize: '1rem',
                cursor: loading ? 'not-allowed' : 'pointer',
                fontWeight: 'bold',
                opacity: loading ? 0.5 : 1,
              }}
            >
              {loading ? '⏳ Importing...' : '✓ Import All (ActiveGate + Managed + Hub + EOS)'}
            </button>

            {loading && (
              <div style={{ marginTop: '10px' }}>
                <div style={{ color: '#9ddfff', fontSize: '0.88rem' }}>
                  Import in progress. This can take around 45-60 seconds.
                </div>
                <div className="progress-track" role="progressbar" aria-label="Import progress">
                  <div className="progress-bar" />
                </div>
              </div>
            )}

            <div style={{ marginTop: '20px' }}>
              <button
                onClick={() => setAdvancedOpen(!advancedOpen)}
                style={{
                  background: 'transparent',
                  color: '#9ddfff',
                  border: 'none',
                  cursor: 'pointer',
                  fontSize: '0.9rem',
                }}
              >
                {advancedOpen ? 'Hide Advanced Import' : 'Show Advanced Import'}
              </button>
            </div>

            {advancedOpen && (
              <div
                style={{
                  marginTop: '12px',
                  background: '#313154',
                  border: '1px solid #4a4a6f',
                  borderRadius: '8px',
                  padding: '14px',
                }}
              >
                <div style={{ marginBottom: '10px', color: '#ddd' }}>
                  Advanced single-source import
                </div>
                <select
                  value={source}
                  onChange={(e) => setSource(e.target.value)}
                  disabled={loading}
                  style={{
                    width: '100%',
                    padding: '10px',
                    background: '#1a1a2e',
                    color: '#eee',
                    border: '1px solid #4a4a6f',
                    borderRadius: '6px',
                    marginBottom: '10px',
                  }}
                >
                  <option value="releases">Releases</option>
                  <option value="managed">Managed Releases</option>
                  <option value="hub">Hub</option>
                  <option value="eos">EOS</option>
                  <option value="url">Custom URL</option>
                </select>

                {source === 'url' && (
                  <input
                    type="url"
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://example.com..."
                    disabled={loading}
                    style={{
                      width: '100%',
                      padding: '10px',
                      background: '#1a1a2e',
                      border: '1px solid #4a4a6f',
                      borderRadius: '6px',
                      color: '#eee',
                      marginBottom: '10px',
                    }}
                  />
                )}

                <button
                  onClick={() => handleIngest(source)}
                  disabled={loading || (source === 'url' && !url.trim())}
                  style={{
                    padding: '10px 18px',
                    background: '#2d9bb8',
                    border: 'none',
                    borderRadius: '6px',
                    color: '#fff',
                    cursor: 'pointer',
                    opacity:
                      loading || (source === 'url' && !url.trim()) ? 0.5 : 1,
                  }}
                >
                  Run Advanced Import
                </button>
              </div>
            )}

            {result && (
              <div style={{ marginTop: '20px' }}>
                {result.error ? (
                  <div
                    style={{
                      background: '#3a3a5a',
                      border: '1px solid #ef4444',
                      color: '#ef4444',
                      padding: '15px',
                      borderRadius: '8px',
                    }}
                  >
                    ❌ Error: {result.error}
                  </div>
                ) : (
                  <div
                    style={{
                      background: '#3a3a5a',
                      border: '1px solid #22c55e',
                      color: '#22c55e',
                      padding: '15px',
                      borderRadius: '8px',
                    }}
                  >
                    <div>✓ Ingestion successful!</div>
                    <div
                      style={{
                        fontSize: '0.9rem',
                        marginTop: '8px',
                        color: '#eee',
                      }}
                    >
                      <div>
                        Source: <strong>{result.source}</strong>
                      </div>
                      <div>
                        Items scraped: <strong>{result.items_scraped}</strong>
                      </div>
                      <div>
                        Facts extracted:{' '}
                        <strong>{result.facts_extracted}</strong>
                      </div>
                      {result.pipeline && (
                        <div style={{ marginTop: '8px' }}>
                          Steps: {result.pipeline.map((p) => p.source).join(' → ')}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
