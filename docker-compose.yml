# ActiveGate Compatibility Intelligence - Docker Compose
# For local development and testing

services:
  # Neo4j Database
  neo4j:
    image: neo4j:5.14-community
    container_name: agi-neo4j
    ports:
      - '7474:7474' # HTTP
      - '7687:7687' # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:7474 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ActiveGate Compatibility Intelligence App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agi-app
    ports:
      - '5000:5000'
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      neo4j:
        condition: service_healthy
    command: ['python', '-m', 'src.cli.main', 'status']

  # CLI (for running commands)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agi-cli
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    profiles:
      - cli
    command: ['python', '-m', 'src.cli.main', '--help']

  # Scheduler (for weekly data refresh)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agi-scheduler
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REFRESH_INTERVAL=7
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    profiles:
      - scheduler
    command: ['python', '-m', 'src.ingestion.scheduler']

volumes:
  neo4j_data:
  neo4j_logs:
