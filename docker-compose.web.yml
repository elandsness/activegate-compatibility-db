# ActiveGate Compatibility Intelligence - Web Docker Compose
services:
  neo4j:
    image: neo4j:5.14-community
    container_name: agi-neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: agi-api
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - PORT=5000
      - FLASK_DEBUG=0
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      neo4j:
        condition: service_healthy
    command: ['python', '-m', 'src.api.app']

  web:
    image: nginx:alpine
    container_name: agi-web
    ports:
      - '3000:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  neo4j_data:
